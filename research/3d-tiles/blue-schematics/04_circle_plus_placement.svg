<text x="32" y="614" font-size="17" font-weight="bold" fill="#233c43">Blue width L. Input region: 2L/3 with L/6 margins. Input centres: L/3 and 2L/3.</text>
<text x="32" y="645" font-size="16" font-weight="normal" fill="#233c43">Centred on the junction, inputs coincide with lower keys at 5L/6 and 7L/6.</text>
<text x="32" y="688" font-size="15" font-weight="normal" fill="#233c43">Verified with nominal ring/plus profiles: 230,400 integer-offset/value/quarter-turn checks; only the corner offset fits.</text>
<text x="32" y="722" font-size="15" font-weight="normal" fill="#233c43">The spacing carries the alignment constraint. Both value symbols remain C4-symmetric; the six-type reduction is preserved.</text>
