<text x="690" y="1060" font-size="16" font-weight="normal" fill="#233c43">Two layer heights lower, if layers have equal thickness.</text>
<text x="690" y="1108" font-size="16" font-weight="normal" fill="#233c43">Other exposed C ports get clearance, not data sockets.</text>
<text x="690" y="1146" font-size="16" font-weight="bold" fill="#233c43">Finish the previous layer; no bridging over missing pieces.</text>
<text x="32" y="1280" font-size="16" font-weight="normal" fill="#233c43">Purple input boxes are typed placeholders. The section shows the height relationship, not a finished CAD profile.</text>
<text x="32" y="1320" font-size="16" font-weight="normal" fill="#233c43">Actual purple key shapes and clearances remain to be designed; the four logical cases are verified for all 512 neighbourhoods.</text>
<text x="32" y="1359" font-size="17" font-weight="bold" fill="#233c43">Black/white denotes the new Life cell state. Every corner on one tile carries that same state.</text>
