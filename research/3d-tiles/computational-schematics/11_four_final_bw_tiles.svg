<text x="32" y="79" font-size="17" font-weight="normal" fill="#233c43">Two recessed inputs: the purple category and the original centre C. Four raised outputs: the next cell state.</text>
<text x="32" y="111" font-size="16" font-weight="normal" fill="#233c43">Bottom and top use the same assembly coordinates. C* is the combined square/diamond recess: C0 OR C1.</text>
